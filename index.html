<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Link Hunter Dashboard</title><style>body{margin:0;background:#070b12;color:#eaf2ff;font-family:system-ui}.wrap{max-width:900px;margin:60px auto;padding:24px}.card{background:#101722;border:1px solid #223047;border-radius:18px;padding:24px;box-shadow:0 20px 60px #0008}h1{color:#67e8f9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.stat{background:#0b111b;border-radius:14px;padding:18px}.n{font-size:30px;font-weight:800}.muted{color:#94a3b8}button{background:#22d3ee;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}input{width:70%;padding:12px;border-radius:10px;border:1px solid #334155;background:#080d15;color:white}</style></head><body><main class="wrap"><section class="card"><h1>🔗 Link Hunter Dashboard</h1><p class="muted">Manage and export links you own or are authorized to use.</p><div class="grid"><div class="stat"><div class="muted">Links</div><div class="n" id="count">0</div></div><div class="stat"><div class="muted">Status</div><div class="n">Ready</div></div></div><h2>Add link</h2><input id="url" placeholder="https://example.com"><button onclick="add()">Add</button><div id="list"></div><br><button onclick="exportLinks()">Export Links</button></section></main><script>let links=JSON.parse(localStorage.getItem('links')||'[]');function draw(){count.textContent=links.length;list.innerHTML=links.map((x,i)=>`<p>${i+1}. ${x}</p>`).join('')}function add(){let v=url.value.trim();if(!/^https?:\/\//.test(v))return alert('Enter a valid http(s) URL');links.push(v);localStorage.setItem('links',JSON.stringify(links));url.value='';draw()}function exportLinks(){let b=new Blob([links.join('\n')],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='links.txt';a.click()}draw()</script></body></html>
