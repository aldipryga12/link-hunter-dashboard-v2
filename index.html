<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Link Hunter Dashboard</title><style>body{margin:0;background:#070b12;color:#eaf2ff;font-family:system-ui}.wrap{max-width:900px;margin:60px auto;padding:24px}.card{background:#101722;border:1px solid #223047;border-radius:18px;padding:24px;box-shadow:0 20px 60px #0008}h1{color:#67e8f9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.stat{background:#0b111b;border-radius:14px;padding:18px}.n{font-size:30px;font-weight:800}.muted{color:#94a3b8}.row{display:flex;gap:8px;flex-wrap:wrap}button{background:#22d3ee;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}button.secondary{background:#1e293b;color:#e2e8f0}input{flex:1;min-width:240px;padding:12px;border-radius:10px;border:1px solid #334155;background:#080d15;color:white}.item{background:#0b111b;border:1px solid #1f2937;border-radius:12px;padding:12px;margin-top:10px}.ok{color:#86efac}.bad{color:#fca5a5}.warn{color:#fde68a}</style></head><body><main class="wrap"><section class="card"><h1>🔗 Link Hunter Dashboard</h1><p class="muted">Manage and validate links you own or are authorized to use.</p><div class="grid"><div class="stat"><div class="muted">Links</div><div class="n" id="count">0</div></div><div class="stat"><div class="muted">Valid format</div><div class="n" id="validCount">0</div></div></div><h2>Add / validate link</h2><div class="row"><input id="url" placeholder="https://example.com"><button onclick="add()">Add</button><button class="secondary" onclick="validateInput()">Validate</button></div><p id="checkResult" class="muted"></p><div id="list"></div><br><div class="row"><button onclick="exportLinks()">Export Links</button><button class="secondary" onclick="clearAll()">Clear All</button></div></section></main><script>let links=JSON.parse(localStorage.getItem('links')||'[]');function parseUrl(v){try{let u=new URL(v);return ['http:','https:'].includes(u.protocol)?u:null}catch{return null}}function draw(){count.textContent=links.length;validCount.textContent=links.filter(x=>parseUrl(x)).length;list.innerHTML=links.map((x,i)=>{let u=parseUrl(x),status=u?'<span class="ok">Valid URL format</span>':'<span class="bad">Invalid URL</span>';return `<div class="item"><b>${i+1}.</b> ${escapeHtml(x)}<br>${status}<br><button class="secondary" onclick="removeLink(${i})">Remove</button></div>`}).join('')}function escapeHtml(s){return s.replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}function validateInput(){let v=url.value.trim(),u=parseUrl(v);if(!v){checkResult.textContent='Enter a link first.';checkResult.className='warn';return}if(!u){checkResult.textContent='Invalid URL format.';checkResult.className='bad';return}checkResult.textContent=`Valid URL format • host: ${u.hostname}`;checkResult.className='ok'}function add(){let v=url.value.trim(),u=parseUrl(v);if(!u)return validateInput();links.push(v);localStorage.setItem('links',JSON.stringify(links));url.value='';checkResult.textContent='Saved.';checkResult.className='ok';draw()}function removeLink(i){links.splice(i,1);localStorage.setItem('links',JSON.stringify(links));draw()}function clearAll(){if(!confirm('Clear all saved links?'))return;links=[];localStorage.removeItem('links');draw()}function exportLinks(){let b=new Blob([links.join('\n')],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='links.txt';a.click();URL.revokeObjectURL(a.href)}draw()</script></body></html>
